<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#7761bf">
    <meta name="description" content="Lara is your private personal operator. Turn intentions into verified work, with memory and control that stay with you.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="color-scheme" content="light">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/style.css">
    <title>Lara — Your personal operator</title>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to workspace</a>
    <div id="offline-banner" class="offline-banner" hidden>You're offline. Reconnect to run goals or load your private workspace.</div>
    <div id="app"><div class="boot-screen"><div class="brand-mark">l</div><p>Opening your workspace…</p></div></div>
    <div id="modal-root"></div>
    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
    <noscript><p class="noscript">Lara needs JavaScript to protect and open your private workspace.</p></noscript>
  </body>
</html>
